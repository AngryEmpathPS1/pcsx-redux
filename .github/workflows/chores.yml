name: chores

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen-i18n:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true
      - name: Fetch submodules
        run: ./.github/scripts/update-submodules.sh
      - name: Install gettext
        run: sudo apt-get install -y gettext
      - name: Regenerate i18n files
        run: make regen-i18n
      - name: Cleanup
        run: rm -f i18n/*~
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CHORES_PAT }}
          commit-message: "[Chores] Regen i18n"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: chores-i18n
          delete-branch: true
          title: "[Chores] Regen i18n"
          draft: false

  code-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: true
      - name: Fetch submodules
        run: ./.github/scripts/update-submodules.sh
      - name: Format code
        run: ./tools/code-format/format.sh
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CHORES_PAT }}
          commit-message: "[Chores] Format code"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: chores-code-format
          delete-branch: true
          title: "[Chores] Format code"
          draft: false

  export-support:
    runs-on: ubuntu-latest
    # The plain image support-mirror.yml builds the mirror in, so the build
    # before the push is the one pull requests get.
    container:
      image: ubuntu:26.04

    steps:
      # Before the checkout, which without git fetches the files through the
      # REST API, with no history for filter-branch to rewrite.
      - name: Install git and the mirror's build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ make pkg-config zlib1g-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Filter repository
        env:
          FILTER_BRANCH_SQUELCH_WARNING: 1
        run: |
          # The workspace is the runner user's and the container runs as root,
          # and checkout's safe.directory is in a global config of its own step.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp -rv .github/filter-support .github/scripts/update-submodules.sh /tmp
          /tmp/filter-support/filter.sh
      # The mirror is pushed only if it builds, the way its users build it.
      - name: Fetch the mirror's submodules
        run: /tmp/update-submodules.sh
      - name: Build the mirror
        run: make -j 2
      - name: Pushing result
        env:
          PAT: ${{ secrets.EXPORT_PAT }}
        run: |
          git config -l | grep 'http\..*\.extraheader' | cut -d= -f1 | xargs -L1 git config --unset-all
          git remote add support "https://rixnobis:$PAT@github.com/pcsx-redux/support.git"
          git push --force "https://rixnobis:$PAT@github.com/pcsx-redux/support.git" main
